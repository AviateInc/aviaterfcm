name: Deploy GitHub Pages preview

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the site
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Install dependencies
              run: npm ci
            - name: Build the static preview
              run: npm run build:pages
              env:
                  PAGES_BASE_PATH: /${{ github.event.repository.name }}
            - name: Upload the site
              uses: actions/upload-pages-artifact@v4
              with:
                  path: out

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Publish the preview
              id: deployment
              uses: actions/deploy-pages@v4
